openapi: 3.1.0
info:
  title: Codespace Windows Desktop Commander Bridge
  version: 1.0.0
  description: |
    Adds Windows execution to the existing Codespace Supervisor without Codex
    or a second AI agent. The Custom GPT remains the only reasoning agent.
    The Windows Relay is an outbound-only deterministic executor and state
    carrier. Internal relay endpoints and device credentials are intentionally
    excluded from this Action contract.
servers:
  - url: https://cautious-space-succotash-r7p4gjxw6qj5hpv59-8787.app.github.dev
security:
  - BridgeBearerAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check the existing Codespace supervisor
      responses:
        "200":
          description: Supervisor is healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /windows/status:
    get:
      operationId: windowsStatus
      summary: Check Windows Relay and Desktop Commander connectivity
      responses:
        "200":
          description: Windows connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WindowsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /windows/capabilities:
    get:
      operationId: getWindowsCapabilities
      summary: Get the effective server-side Windows tool policy
      responses:
        "200":
          description: Effective Windows capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/WindowsUnavailable"

  /windows/pairing:
    post:
      operationId: createWindowsPairing
      summary: Create a short-lived one-time pairing code
      description: |
        Creates a temporary code that the user enters locally into the Windows
        Relay installer. The long-term device credential is returned only to
        the Windows Relay and is never exposed through this GPT Action.
      responses:
        "201":
          description: Pairing code created
          content:
            application/json:
              schema:
                type: object
                required: [pairingId, code, expiresAt]
                properties:
                  pairingId:
                    type: string
                  code:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  instructions:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /windows/sessions:
    post:
      operationId: createWindowsSession
      summary: Create a scoped Windows work session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WindowsSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/WindowsUnavailable"

  /windows/sessions/{sessionId}:
    get:
      operationId: getWindowsSession
      summary: Get Windows session state
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WindowsSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /windows/sessions/{sessionId}/tool:
    post:
      operationId: invokeWindowsTool
      summary: Execute one deterministic tool operation on Windows
      description: |
        The GPT chooses one operation. The Codespace validates policy, the
        Windows Relay executes it, and the result returns to the GPT. No LLM
        or autonomous AI loop exists in the gateway or relay.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolInvocationRequest"
      responses:
        "200":
          description: Tool completed synchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInvocation"
        "202":
          description: Tool accepted and still running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInvocation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/WindowsUnavailable"

  /windows/sessions/{sessionId}/invocations/{invocationId}:
    get:
      operationId: getWindowsInvocation
      summary: Get a Windows invocation result
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/InvocationId"
      responses:
        "200":
          description: Invocation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInvocation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /windows/sessions/{sessionId}/events:
    get:
      operationId: getWindowsEvents
      summary: Observe the auditable Windows event stream
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: afterSequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Session events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /windows/sessions/{sessionId}/complete:
    post:
      operationId: completeWindowsSession
      summary: Mark a Windows work session completed
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [summary]
              properties:
                summary:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        "200":
          description: Session completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WindowsSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session still has active work or is already cancelled

  /windows/sessions/{sessionId}/cancel:
    post:
      operationId: cancelWindowsSession
      summary: Cancel active work associated with a Windows session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Session cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WindowsSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BridgeBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Existing BRIDGE_TOKEN used by the Custom GPT.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,128}$"
    InvocationId:
      name: invocationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,128}$"

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid BRIDGE_TOKEN
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Operation is outside the server-side policy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WindowsUnavailable:
      description: Windows Relay is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    WindowsStatus:
      type: object
      required: [relayConnected, desktopCommanderAvailable, paired, activeSessionCount]
      properties:
        relayConnected:
          type: boolean
        desktopCommanderAvailable:
          type: boolean
        paired:
          type: boolean
        machineId:
          type: string
        machineName:
          type: string
        platform:
          type: string
        connectedAt:
          type: string
          format: date-time
        lastHeartbeat:
          type: string
          format: date-time
        relayVersion:
          type: string
        desktopCommanderVersion:
          type: string
        activeSessionCount:
          type: integer
          minimum: 0

    Capabilities:
      type: object
      required: [tools, allowedRoots, allowedExecutables]
      properties:
        tools:
          type: array
          items:
            type: string
            enum:
              - listDirectory
              - readFile
              - writeFile
              - createDirectory
              - copyPath
              - movePath
              - deletePath
              - searchFiles
              - runCommand
              - listProcesses
        allowedRoots:
          type: array
          items:
            type: string
        allowedExecutables:
          type: array
          items:
            type: string
        desktopControl:
          type: boolean
        shell:
          type: boolean
        filesystemRead:
          type: boolean
        filesystemWrite:
          type: boolean
        destructiveDelete:
          type: boolean
        maximumCommandSeconds:
          type: integer
        maximumOutputBytes:
          type: integer
        policyName:
          type: string
        desktopCommanderAvailable:
          type: boolean
        desktopCommanderTools:
          type: array
          items:
            type: string

    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [brief]
      properties:
        title:
          type: string
          maxLength: 200
        brief:
          type: string
          minLength: 1
          maxLength: 30000
        successCriteria:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 3000
        requestedRoots:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 1024
        constraints:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 3000
        policyProfile:
          type: string
          maxLength: 100
          default: default

    WindowsSession:
      type: object
      required: [sessionId, status, createdAt]
      properties:
        sessionId:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [active, waiting, completed, failed, cancelled]
        brief:
          type: string
        effectiveRoots:
          type: array
          items:
            type: string
        policyProfile:
          type: string
        currentActivity:
          type: string
        activeInvocationId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resultSummary:
          type: [string, "null"]

    ToolInvocationRequest:
      type: object
      additionalProperties: false
      required: [tool, arguments, reason]
      properties:
        tool:
          type: string
          enum:
            - listDirectory
            - readFile
            - writeFile
            - createDirectory
            - copyPath
            - movePath
            - deletePath
            - searchFiles
            - runCommand
            - listProcesses
        arguments:
          type: object
          additionalProperties: true
          description: |
            Tool-specific arguments. runCommand uses argv:string[], cwd:string,
            timeoutSeconds?:integer. File tools use absolute Windows paths.
        reason:
          type: string
          minLength: 1
          maxLength: 3000
        expectedOutcome:
          type: string
          maxLength: 3000

    ToolInvocation:
      type: object
      required: [invocationId, tool, status]
      properties:
        invocationId:
          type: string
        tool:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, denied, cancelled]
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        exitCode:
          type: [integer, "null"]
        stdout:
          type: string
        stderr:
          type: string
        result:
          type: [object, "null"]
          additionalProperties: true
        truncated:
          type: boolean
        error:
          anyOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"

    Event:
      type: object
      required: [sequence, timestamp, type, message]
      properties:
        sequence:
          type: integer
          minimum: 1
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - session_created
            - tool_requested
            - tool_started
            - tool_completed
            - tool_failed
            - tool_denied
            - session_completed
            - session_cancelled
        message:
          type: string
        tool:
          type: string
        invocationId:
          type: string

    EventsResponse:
      type: object
      required: [sessionId, events, lastSequence, hasMore]
      properties:
        sessionId:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        lastSequence:
          type: integer
          minimum: 0
        hasMore:
          type: boolean

    Error:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        code:
          type: string
        message:
          type: string
      additionalProperties: true
