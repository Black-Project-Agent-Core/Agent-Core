<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700">
<rect width="2400" height="1700" fill="#0B1020"/>
<text x="80" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#F4F7FF">Agent Core — Memory Workflow</text>
<text x="80" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#A8B3CF">Canonical file-native Memory • BM25/fusion + EmbeddingGemma • Learning-reviewed capture</text>
<rect x="830" y="170" rx="22" width="740" height="130" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="844" y="184" rx="6" width="12" height="102" fill="#5FE1D5"/>
<text x="874" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">AI CONTROLLER</text>
<text x="874" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">Reads Memory first, supplies semantic metadata when</text>
<text x="874" y="276" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">confident, chooses explicit read/write/review actions.</text>
<rect x="790" y="370" rx="22" width="820" height="150" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="804" y="384" rx="6" width="12" height="122" fill="#5EA7FF"/>
<text x="834" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">MemoryService</text>
<text x="834" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">Owns canonical records, safety, provenance, index freshness,</text>
<text x="834" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">retrieval metadata and transactions.</text>
<rect x="70" y="610" rx="22" width="690" height="150" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="84" y="624" rx="6" width="12" height="122" fill="#5FE1D5"/>
<text x="114" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">READ / RETRIEVAL</text>
<text x="114" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">memory_list • memory_page • memory_read •</text>
<text x="114" y="716" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">memory_search • diagnostics • export</text>
<rect x="835" y="610" rx="22" width="730" height="210" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="849" y="624" rx="6" width="12" height="182" fill="#5EA7FF"/>
<text x="879" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">SEARCH PIPELINE</text>
<text x="879" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">reload canonical → ensure index → optional embedding →</text>
<text x="879" y="716" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">legacy / BM25 / fusion → dedup + threshold/MMR → active</text>
<text x="879" y="744" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">temporal-link expansion → bounded char budget</text>
<rect x="1640" y="610" rx="22" width="690" height="210" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="1654" y="624" rx="6" width="12" height="182" fill="#A98BFF"/>
<text x="1684" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">EVIDENCE / DIAGNOSTICS</text>
<text x="1684" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">Touch recall metadata; record query hash + exposures</text>
<text x="1684" y="716" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">in bounded retrieval ledger; diagnostics join</text>
<text x="1684" y="744" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">feedback + tracker outcomes without claiming model</text>
<text x="1684" y="772" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">use.</text>
<rect x="70" y="900" rx="22" width="690" height="180" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="84" y="914" rx="6" width="12" height="152" fill="#65D99B"/>
<text x="114" y="942" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">WRITE / CANONICAL MUTATION</text>
<text x="114" y="978" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">remember • update • batch • delete • feedback •</text>
<text x="114" y="1006" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">import(apply) with explicit confirmation where</text>
<text x="114" y="1034" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">required.</text>
<rect x="835" y="900" rx="22" width="730" height="180" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="849" y="914" rx="6" width="12" height="152" fill="#65D99B"/>
<text x="879" y="942" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">VALIDATE + ENRICH</text>
<text x="879" y="978" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">Safety scan • controller metadata or deterministic</text>
<text x="879" y="1006" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">fallback • source/provenance • link validity/evidence</text>
<text x="879" y="1034" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">checks • pinned-foundation guards.</text>
<rect x="1640" y="900" rx="22" width="690" height="180" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="1654" y="914" rx="6" width="12" height="152" fill="#65D99B"/>
<text x="1684" y="942" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">FileMemoryStore</text>
<text x="1684" y="978" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">Process lock + transactional/atomic writes →</text>
<text x="1684" y="1006" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">canonical Markdown under runtime\memory; batch</text>
<text x="1684" y="1034" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">refreshes derived index once.</text>
<rect x="70" y="1180" rx="22" width="690" height="210" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="84" y="1194" rx="6" width="12" height="182" fill="#5EA7FF"/>
<text x="114" y="1222" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">DERIVED INDEX</text>
<text x="114" y="1258" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">Semantic document + lexical/BM25 + Cloudflare Workers</text>
<text x="114" y="1286" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">AI EmbeddingGemma 300M / 768d. Rebuildable from</text>
<text x="114" y="1314" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">canonical Memory.</text>
<rect x="835" y="1180" rx="22" width="730" height="210" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="849" y="1194" rx="6" width="12" height="182" fill="#A98BFF"/>
<text x="879" y="1222" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">EVOLUTION / RELATIONS</text>
<text x="879" y="1258" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">Optional bounded metadata/link evolution; temporal</text>
<text x="879" y="1286" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">validity + evidence lineage; historical links remain</text>
<text x="879" y="1314" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">canonical, active traversal filters expired links.</text>
<rect x="1640" y="1180" rx="22" width="690" height="210" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="1654" y="1194" rx="6" width="12" height="182" fill="#FFB86B"/>
<text x="1684" y="1222" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">LEARNING LOOP</text>
<text x="1684" y="1258" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">checkpoint → reviewed candidates → verified? → Memory</text>
<text x="1684" y="1286" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">sink for facts/reflections/architecture OR Grafel</text>
<text x="1684" y="1314" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">Pattern sink for repo recipes. Curator is</text>
<text x="1684" y="1342" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">proposal-only.</text>
<rect x="760" y="1480" rx="22" width="880" height="150" fill="#131B31" stroke="#273552" stroke-width="2"/>
<rect x="774" y="1494" rx="6" width="12" height="122" fill="#FF7E8A"/>
<text x="804" y="1522" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F7FF">CANONICAL AUTHORITY</text>
<text x="804" y="1558" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">runtime\memory\00-agent-core-memory.md + notes\*.md are source of</text>
<text x="804" y="1586" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">truth. Derived index/ledger/state are auxiliary and rebuildable;</text>
<text x="804" y="1614" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#A8B3CF">exact source evidence outranks Memory when stale.</text>
