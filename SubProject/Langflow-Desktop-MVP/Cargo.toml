[package]
name = "langflow-desktop-mvp"
version = "0.1.0"
edition = "2024"
description = "Minimal private desktop shell for the local Langflow source checkout"

[dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
