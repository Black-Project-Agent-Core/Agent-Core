[package]
name = "agent-code"
version = "0.1.0"
description = "Agent Code desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
fs2 = "0.4.3"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon"] }
zip = "4.3.0"
